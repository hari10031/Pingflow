name: Auto-add service

# When someone submits an "Add service" issue, validate the endpoint and, if it
# passes, append it to services.json automatically — then comment and close.
# No human step. Guardrails live in scripts/add-from-issue.mjs.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Serialize file writes so two submissions can't clobber services.json.
concurrency:
  group: services-json
  cancel-in-progress: false

jobs:
  add:
    if: startsWith(github.event.issue.title, 'Add service:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Label the request
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'service-request'
            try {
              await github.rest.issues.getLabel({ ...context.repo, name: label })
            } catch {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: label,
                color: '10b981',
                description: 'Request to add a service to services.json',
              })
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.issue.number,
              labels: [label],
            })

      - name: Validate and append to services.json
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/add-from-issue.mjs

      - name: Commit the change
        if: steps.add.outputs.added == 'true'
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/services.json
          git commit -m "Add service via #${ISSUE_NUM}"
          git pull --rebase origin main
          git push

      - name: Confirm and close
        if: steps.add.outputs.added == 'true'
        uses: actions/github-script@v7
        env:
          SVC_NAME: ${{ steps.add.outputs.name }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `✅ Added **${process.env.SVC_NAME}** to \`services.json\`. PingFlow starts pinging it on the next scheduled run (within 10 minutes).`,
            })
            await github.rest.issues.update({
              ...context.repo,
              issue_number: context.issue.number,
              state: 'closed',
            })

      - name: Explain why it wasn't added
        if: steps.add.outputs.added != 'true'
        uses: actions/github-script@v7
        env:
          REASON: ${{ steps.add.outputs.reason }}
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `⚠️ This wasn't added automatically: ${process.env.REASON}\n\nEdit the issue to fix it and reopen, or a maintainer can add it by hand.`,
            })

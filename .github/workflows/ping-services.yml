name: Ping Services

# Keeps free-tier backends awake by pinging each URL in src/data/services.json.
on:
  schedule:
    # Every 10 minutes, around the clock.
    - cron: '*/10 * * * *'
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

# Avoid overlapping runs if one takes longer than the interval.
concurrency:
  group: ping-services
  cancel-in-progress: false

jobs:
  ping:
    name: Ping all services
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ping services
        run: node scripts/ping.mjs
